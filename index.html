<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/crown.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14161a" />
    <meta name="description" content="Terrafunded Quest v2 — operating tool for $10M net profit by 2027-12-31." />
    <title>Quest</title>
    <script>
      // Apply the theme before the first paint so there is no flash of another skin. Mirrors
      // LOCKED_THEME in src/theme/themes.ts: while the skin selector is hidden every user is held
      // to Iron Crown and a previously stored skin is ignored (React overwrites it on mount). Set
      // `locked` to null here and LOCKED_THEME to null there to honour the stored choice again.
      (function () {
        var themes = { "iron-crown": "#14161a", "gilded-realm": "#efe6d2", "neon-kingdom": "#07070d" };
        var locked = "iron-crown";
        var id = "iron-crown";
        try {
          var stored = locked || localStorage.getItem("quest.theme");
          if (stored && themes[stored]) id = stored;
        } catch (e) {}
        var root = document.documentElement;
        root.setAttribute("data-theme", id);
        var light = id === "gilded-realm";
        root.classList.toggle("dark", !light);
        root.classList.toggle("light", light);
        root.style.colorScheme = light ? "light" : "dark";
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", themes[id]);
        // Boot language before paint (quest.lang); React syncDocumentLang confirms on mount.
        var bootLang = "es";
        try {
          var ql = localStorage.getItem("quest.lang");
          if (ql === "en" || ql === "es") bootLang = ql;
        } catch (e) {}
        root.lang = bootLang;
        window.__QUEST_BOOT_LANG__ = bootLang;
      })();
    </script>
  </head>
  <body class="bg-background text-foreground">
    <div id="root">
      <!-- Painted before the bundle runs; React replaces it on mount. Uses the theme tokens from the stylesheet. -->
      <div class="boot-shell" aria-hidden="true">
        <div class="boot-shell__brand">Quest</div>
        <div class="boot-shell__hint" id="boot-hint">Entrando a Quest…</div>
      </div>
    </div>
    <script>
      (function () {
        var hint = document.getElementById("boot-hint");
        if (!hint) return;
        var lang = window.__QUEST_BOOT_LANG__ || "es";
        hint.textContent = lang === "en" ? "Entering Quest…" : "Entrando a Quest…";
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
